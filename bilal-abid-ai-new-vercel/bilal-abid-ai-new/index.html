<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Bilal Abid AI</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#172238;--line:#293750;--text:#eef3ff;--muted:#9aa9c0;--a:#8795ff;--b:#55dfcc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#293865 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
.shell{max-width:950px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 17px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#08101c;font-weight:950;font-size:21px}
.status{font-size:12px;color:#a9f2df;border:1px solid #28584e;background:#12332e;border-radius:99px;padding:5px 10px}
main{flex:1;display:flex;flex-direction:column}.intro{text-align:center;margin:auto auto 25px;padding-top:65px;max-width:650px}.intro h1{font-size:clamp(31px,5vw,47px);line-height:1.12;letter-spacing:-1.5px;margin:0 0 12px}.grad{background:linear-gradient(90deg,#b4beff,#6ce8d6);color:transparent;background-clip:text}.intro p{color:var(--muted);margin:0}
.chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chips button{border:1px solid var(--line);background:#121d30;color:#d4def0;padding:9px 12px;border-radius:12px;cursor:pointer}.chips button:hover{border-color:var(--a)}
#messages{display:none;flex-direction:column;gap:17px;width:100%;max-width:790px;margin:25px auto}.msg{display:flex;gap:10px;align-items:flex-start}.avatar{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#253354;color:#c8d0ff;font-size:11px;font-weight:800}.msg.user .avatar{background:#17443e;color:#a8f4e6}.bubble{max-width:calc(100% - 42px);min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:4px 14px 14px 14px;background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .bubble{background:#17263e;border-color:#344b70}.bubble.error{color:#ffb8b8;border-color:#75444a}.bubble.pending{color:#aab8d0}
.composer-area{position:sticky;bottom:0;margin-top:auto;padding:15px 0 5px;background:linear-gradient(transparent,var(--bg) 18%)}.composer{max-width:790px;margin:auto;display:flex;gap:9px;align-items:flex-end;padding:10px;background:var(--panel);border:1px solid #34435e;border-radius:17px}.composer:focus-within{border-color:var(--a);box-shadow:0 0 0 3px #8795ff20}
textarea{flex:1;min-height:42px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:9px}textarea::placeholder{color:#7788a4}
#send{border:0;border-radius:12px;padding:11px 17px;background:linear-gradient(135deg,var(--a),#6879e9);color:white;font-weight:750;cursor:pointer}#send:disabled{opacity:.55;cursor:wait}.hint{text-align:center;color:#71809a;font-size:11px;margin:9px 0}.newchat{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}.newchat:hover{color:white}
@media(max-width:600px){.shell{padding:13px}.intro{padding-top:55px}.chips button{font-size:12px}.bubble{font-size:14px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo">B</div>Bilal Abid AI</div><div style="display:flex;align-items:center;gap:13px"><span class="status">● Ready</span><button class="newchat" id="newchat">New chat</button></div></header>
<main>
<section class="intro" id="intro"><h1>Ask anything.<br><span class="grad">Discover more.</span></h1><p>Your AI assistant for learning, ideas, writing and everyday questions.</p>
<div class="chips"><button>Explain quantum physics simply</button><button>Help me write a website</button><button>Give me a business idea</button><button>Teach me Python</button></div></section>
<section id="messages" aria-live="polite"></section>
<div class="composer-area"><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="Message Bilal Abid AI..." aria-label="Message"></textarea><button id="send" type="submit">Send ↑</button></form><div class="hint">AI can make mistakes. Verify important information.</div></div>
</main></div>
<script>
const form=document.querySelector('#form'),box=document.querySelector('#prompt'),send=document.querySelector('#send'),messages=document.querySelector('#messages'),intro=document.querySelector('#intro');
let history=[],busy=false,activeController=null;
function add(role,text,kind=''){intro.style.display='none';messages.style.display='flex';const row=document.createElement('div');row.className='msg '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'YOU':'BA';const bubble=document.createElement('div');bubble.className='bubble '+kind;bubble.textContent=text;row.append(avatar,bubble);messages.append(row);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});return bubble}
async function ask(text){
 if(busy||!text.trim())return;busy=true;add('user',text);const prior=history.slice(-10);history.push({role:'user',text});
 const pending=add('assistant','Connecting to Gemini…','pending');send.disabled=true;box.disabled=true;send.textContent='Wait…';
 activeController=new AbortController();const timer=setTimeout(()=>activeController.abort(),45000);
 try{
  const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:prior}),signal:activeController.signal});
  const data=await response.json().catch(()=>({error:'The server did not return valid JSON. Check Vercel Function Logs.'}));
  if(!response.ok)throw new Error(data.error||`Server error ${response.status}`);
  if(!data.answer)throw new Error('The server returned no answer. Please try again.');
  pending.textContent=data.answer;pending.classList.remove('pending');history.push({role:'model',text:data.answer});
 }catch(err){
  const message=err.name==='AbortError'?'The request took too long (45 seconds) and was stopped. Check Vercel Function Logs and Gemini API quota.':err.message;
  pending.textContent='⚠️ '+message;pending.classList.remove('pending');pending.classList.add('error');history.pop();
 }finally{clearTimeout(timer);activeController=null;busy=false;send.disabled=false;box.disabled=false;send.textContent='Send ↑';box.focus()}
}
form.addEventListener('submit',e=>{e.preventDefault();const t=box.value.trim();if(!t||busy)return;box.value='';box.style.height='auto';ask(t)});
box.addEventListener('input',()=>{box.style.height='auto';box.style.height=Math.min(box.scrollHeight,150)+'px'});
box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.querySelectorAll('.chips button').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));
document.querySelector('#newchat').addEventListener('click',()=>{if(activeController)activeController.abort();history=[];messages.innerHTML='';messages.style.display='none';intro.style.display='block';box.value=''});
</script>
</body></html>
